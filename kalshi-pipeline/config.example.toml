# Shared paper-trader and executor config. Copy to the ignored local
# config.toml and fill in. For a production-ready starting point, see
# config.live.example.toml.
# Get an API key at kalshi.com -> Account -> API keys. Download the RSA private
# key file; NEVER commit it or paste it into chat.

key_id = "your-key-id-here"
private_key_path = "kalshi_private_key.pem"

size = 1.0             # contracts per signal; keep at 1 through demo validation
hold_minutes = 5       # drift horizon from the pilot study
exit_timeout_s = 120   # maker exit wait before crossing the spread
max_spread_cents = 2   # skip signals on wide books
entry_events = ["home_run", "single", "double", "triple", "walk", "hit_by_pitch"]
log_path = "paper_trades.csv"

# Environment. Start with the demo endpoints; production needs both explicit
# switches in the executor as well as a separately funded live API key.
api_base = "https://external-api.demo.kalshi.co/trade-api/v2"
ws_base = "wss://external-api-ws.demo.kalshi.co/trade-api/ws/v2"

# Live execution is deliberately disabled. `kalshi-executor preflight` can
# authenticate and inspect portfolio state while both remain false.
live_enabled = false
confirm_prod = false
max_exposure_cents = 2500
per_market_cap_cents = 500
daily_loss_stop_cents = 500
max_orders_per_min = 10
max_price_distance_cents = 5
adopt_positions_on_boot = false
balance_floor_cents = 0

# Executor input and safety controls. The executor reads a fresh strategy
# snapshot at intent_path; an old or missing snapshot cancels and flattens.
intent_path = "desired_positions.json"
run_dir = "."
stale_data_seconds = 30
poll_seconds = 5
